name = "jsot"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "frontend/dist"

# ==========================================
# PRODUCTION (Used automatically on 'main')
# ==========================================
[[d1_databases]]
binding = "DB"
database_name = "jsot-db"
database_id = "d4af4bee-5a99-4b1a-9416-01568027fefd"

[[r2_buckets]]
binding = "R2"
bucket_name = "jsot-uploads"

[vars]
JWT_SECRET = "jsot-jwt-secret-2026-cloudgenz"

# ==========================================
# DEV / PREVIEW (Used automatically on 'dev' and PRs)
# ==========================================
[env.preview]
name = "jsot-dev"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "jsot-db-dev"
database_id = "6ad82a0b-6d24-4232-b30e-cff5e7de1ad4"

[[env.preview.r2_buckets]]
binding = "R2"
bucket_name = "jsot-uploads-dev"

[env.preview.vars]
JWT_SECRET = "jsot-jwt-secret-2026-cloudgenz-dev"
